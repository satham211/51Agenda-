<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agenda dos Estúdios A e B</title>
<style>
:root{--ink:#18201d;--muted:#6d7874;--paper:#f5f4ef;--line:#dedfd9;--green:#1f5e4c;--lime:#d8ed70;--blue:#4169e1;--orange:#f08a48}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif}button,input,textarea{font:inherit}.top{height:78px;padding:0 4vw;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:13px;background:var(--ink);color:var(--lime);font-weight:900;display:grid;place-items:center}.brand span{display:block;color:var(--muted);font-size:12px;margin-top:2px}.primary{border:0;border-radius:10px;background:var(--green);color:#fff;padding:12px 17px;font-weight:700;cursor:pointer}.shell{max-width:1450px;margin:auto;padding:30px 4vw}.intro{display:flex;align-items:end;justify-content:space-between;margin-bottom:24px}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.16em;color:var(--green)}h1{font-size:clamp(32px,4vw,48px);margin:6px 0;letter-spacing:-2px}h1 span{color:#8b938f;font-weight:400}.sub{color:var(--muted);font-size:14px}.stats{display:flex;gap:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 19px}.stat b,.stat span{display:block}.stat b{font-size:21px}.stat span{font-size:11px;color:var(--muted)}.toolbar{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-bottom:0;border-radius:15px 15px 0 0;padding:13px}.nav{display:flex}.nav button,.filters button{border:1px solid var(--line);background:#fff;padding:9px 12px;cursor:pointer}.nav button:first-child{border-radius:8px 0 0 8px}.nav button:last-child{border-radius:0 8px 8px 0}.nav .today{border-left:0;border-right:0;font-size:12px}.filters{display:flex;gap:6px}.filters button{border-radius:20px;font-size:12px}.filters .active{background:var(--ink);color:#fff}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.a{background:var(--orange)}.b{background:var(--blue)}.search{margin-left:auto;border:1px solid var(--line);border-radius:9px;padding:8px}.search input{border:0;outline:0;width:150px}.cal{display:grid;grid-template-columns:repeat(7,1fr);background:var(--line);gap:1px;border:1px solid var(--line);overflow:hidden}.weekday{background:#fafaf7;padding:10px;font-size:10px;font-weight:800;color:#89918d}.day{min-height:122px;background:#fff;padding:8px;cursor:pointer}.day:hover{background:#fafbf8}.day.blank{background:#f1f0eb;cursor:default}.num{font-size:12px;font-weight:bold;width:25px;height:25px;display:grid;place-items:center}.num.now{background:var(--green);color:#fff;border-radius:50%}.events{display:flex;flex-direction:column;gap:5px;margin-top:4px}.event{border:0;border-left:3px solid;border-radius:5px;padding:6px;text-align:left;font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.event.ae{background:#fff2e9;border-color:var(--orange);color:#84411c}.event.be{background:#edf1ff;border-color:var(--blue);color:#294292}.event b{margin-right:5px}.hint{text-align:center;color:var(--muted);font-size:11px}.overlay{position:fixed;inset:0;background:#15221dcc;display:none;place-items:center;padding:16px}.overlay.open{display:grid}.modal{background:#fff;border-radius:20px;padding:24px;width:min(460px,100%);max-height:95vh;overflow:auto}.mhead{display:flex;justify-content:space-between}.mhead p{font-size:10px;color:var(--green);font-weight:800}.mhead h2{margin:0 0 18px}.x{border:0;background:#eee;width:32px;height:32px;border-radius:50%;font-size:20px;cursor:pointer}.modal label,.modal legend{display:block;font-size:11px;font-weight:700;color:#59635f;margin-bottom:13px}.modal input,.modal textarea{display:block;width:100%;margin-top:6px;border:1px solid var(--line);border-radius:9px;padding:11px;outline:0}.row,.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal fieldset{border:0;padding:0;margin:0}.choices button{background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px;cursor:pointer}.choices .selA{background:#fff4ed;border-color:var(--orange)}.choices .selB{background:#eff2ff;border-color:var(--blue)}textarea{min-height:70px}.error{display:none;background:#fff0ed;color:#a2372a;padding:10px;border-radius:8px;font-size:12px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.actions button{padding:10px 13px;border-radius:9px;font-weight:bold;cursor:pointer}.cancel{background:#fff;border:1px solid var(--line)}.delete{margin-right:auto;background:#fff0ed;border:1px solid #efbcb4;color:#a2372a}
@media(max-width:760px){.shell{padding:22px 14px;overflow:auto}.intro{display:block}.stats{margin-top:15px}.toolbar,.cal{min-width:680px}.toolbar{flex-wrap:wrap}.filters{order:3;width:100%}.cal{border-radius:0}.day{min-height:105px}.brand span,.sub{display:none}}@media(max-width:450px){.top{padding:0 14px}.top .primary{padding:10px;font-size:12px}.modal{padding:19px}}
.modal select{display:block;width:100%;margin-top:6px;border:1px solid var(--line);border-radius:9px;padding:11px;outline:0;background:#fff}.audit{font-size:11px;color:var(--muted);background:#f5f6f3;border-radius:9px;padding:10px;margin:2px 0 12px;display:none}
</style></head><body>
<header class="top"><div class="brand"><div class="logo">51</div><div><strong>Agenda Interna dos Estúdios</strong><span id="syncStatus">Conectando ao banco...</span></div></div><button class="primary" onclick="openNew()">＋ Nova reserva</button></header>
<main class="shell"><section class="intro"><div><div class="eyebrow">USO INTERNO · EQUIPE ZERO5UM</div><h1 id="title"></h1><div class="sub">Reservas imediatas dos Estúdios A e B para os funcionários da empresa.</div></div><div class="stats"><div class="stat"><b id="count">0</b><span>reservas</span></div><div class="stat"><b id="hours">0h</b><span>agendadas</span></div></div></section>
<section class="toolbar"><div class="nav"><button onclick="move(-1)">‹</button><button class="today" onclick="goToday()">Hoje</button><button onclick="move(1)">›</button></div><div class="filters"><button data-f="Todos" class="active" onclick="setFilter(this)">Todos</button><button data-f="A" onclick="setFilter(this)"><i class="dot a"></i>Estúdio A</button><button data-f="B" onclick="setFilter(this)"><i class="dot b"></i>Estúdio B</button></div><label class="search">⌕ <input id="search" placeholder="Buscar reserva..." oninput="render()"></label></section><section class="cal" id="calendar"></section><p class="hint">Dica: clique em qualquer dia para criar uma reserva.</p></main>
<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()"><form class="modal" onsubmit="save(event)"><div class="mhead"><div><p id="mode">NOVA RESERVA</p><h2 id="modalTitle">Reserve um horário</h2></div><button class="x" type="button" onclick="closeModal()">×</button></div><label>Nome do funcionário responsável<input id="employee" placeholder="Digite seu nome completo" required></label><label>Setor<select id="department" required><option value="">Selecione o setor</option><option>Produção executiva</option><option>Produção artística</option><option>Produção musical / DJ</option><option>Artista</option><option>Vídeo / Fotografia</option><option>Design / Edição</option><option>Administrativo</option><option>Outro</option></select></label><label>Finalidade da reserva<input id="purpose" placeholder="Ex.: Gravação, ensaio, reunião ou produção" required></label><label>Artista ou projeto (opcional)<input id="project" placeholder="Nome do artista, música ou projeto"></label><label>Data<input id="date" type="date" required></label><div class="row"><label>Início<input id="start" type="time" required></label><label>Fim<input id="end" type="time" required></label></div><fieldset><legend>Estúdio</legend><div class="choices"><button id="chooseA" type="button" onclick="choose('A')"><i class="dot a"></i>Estúdio A</button><button id="chooseB" type="button" onclick="choose('B')"><i class="dot b"></i>Estúdio B</button></div></fieldset><label>Quantidade de pessoas<input id="people" type="number" min="1" max="100" value="1"></label><label>Observação (opcional)<textarea id="note" placeholder="Equipamentos, necessidades ou informações importantes..."></textarea></label><div class="audit" id="audit"></div><div class="error" id="error"></div><div class="actions"><button class="delete" id="deleteBtn" type="button" onclick="removeBooking()">Excluir</button><button class="cancel" type="button" onclick="closeModal()">Cancelar</button><button class="primary" type="submit">Salvar reserva</button></div></form></div>
<script>
const M=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'],W=['SEG','TER','QUA','QUI','SEX','SÁB','DOM'],now=new Date();let cursor=new Date(now.getFullYear(),now.getMonth(),1),filter='Todos',studio='A',editing=null;const key=(y,m,d)=>`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;let bookings=[];
async function load(){status("Sincronizando...");try{const r=await fetch("/api/bookings",{cache:"no-store"});if(!r.ok)throw Error();bookings=await r.json();status("✓ Reservas sincronizadas");render()}catch(e){status("Sem conexão — tentando novamente...");setTimeout(load,5000)}}function status(t){document.querySelector("#syncStatus").textContent=t}function render(){const y=cursor.getFullYear(),m=cursor.getMonth(),days=new Date(y,m+1,0).getDate(),offset=(new Date(y,m,1).getDay()+6)%7,q=document.querySelector('#search').value.toLowerCase(),month=bookings.filter(x=>x.date.startsWith(`${y}-${String(m+1).padStart(2,'0')}`));document.querySelector('#title').innerHTML=`${M[m]} <span>${y}</span>`;document.querySelector('#count').textContent=month.length;document.querySelector('#hours').textContent=month.reduce((s,x)=>{let a=x.start.split(':').map(Number),b=x.end.split(':').map(Number);return s+b[0]+b[1]/60-a[0]-a[1]/60},0).toLocaleString('pt-BR',{maximumFractionDigits:1})+'h';let h=W.map(x=>`<div class="weekday">${x}</div>`).join('');for(let i=0;i<42;i++){let d=i-offset+1;if(d<1||d>days){h+='<div class="day blank"></div>';continue}let k=key(y,m,d),items=bookings.filter(x=>x.date===k&&(filter==='Todos'||x.studio===filter)&&(!q||(x.client+' '+x.note).toLowerCase().includes(q))).sort((a,b)=>a.start.localeCompare(b.start));h+=`<div class="day" onclick="openNew('${k}')"><div class="num ${k===key(now.getFullYear(),now.getMonth(),now.getDate())?'now':''}">${d}</div><div class="events">${items.slice(0,3).map(x=>`<button class="event ${x.studio==='A'?'ae':'be'}" onclick="event.stopPropagation();openEdit('${x.id}')"><b>${x.start}</b>${esc(x.client)}</button>`).join('')}${items.length>3?'<small>+ '+(items.length-3)+' reserva(s)</small>':''}</div></div>`}document.querySelector('#calendar').innerHTML=h}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function move(n){cursor=new Date(cursor.getFullYear(),cursor.getMonth()+n,1);render()}function goToday(){cursor=new Date(now.getFullYear(),now.getMonth(),1);render()}function setFilter(b){filter=b.dataset.f;document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}function choose(s){studio=s;document.querySelector('#chooseA').className=s==='A'?'selA':'';document.querySelector('#chooseB').className=s==='B'?'selB':''}
function openNew(d){editing=null;document.querySelector('#mode').textContent='NOVA RESERVA';document.querySelector('#modalTitle').textContent='Reserve um horário';document.querySelector('#employee').value=localStorage.getItem('agenda-employee')||'';document.querySelector('#department').value=localStorage.getItem('agenda-department')||'';document.querySelector('#purpose').value='';document.querySelector('#project').value='';document.querySelector('#people').value='1';document.querySelector('#date').value=d||key(cursor.getFullYear(),cursor.getMonth(),1);document.querySelector('#start').value='09:00';document.querySelector('#end').value='10:00';document.querySelector('#note').value='';document.querySelector('#audit').style.display='none';document.querySelector('#deleteBtn').style.display='none';choose('A');showModal()}function openEdit(id){let x=bookings.find(b=>b.id===id);editing=id;document.querySelector('#mode').textContent='EDITAR RESERVA';document.querySelector('#modalTitle').textContent='Atualize os detalhes';['date','start','end','note'].forEach(k=>document.querySelector('#'+k).value=x[k]||'');document.querySelector('#employee').value=x.employee||'';document.querySelector('#department').value=x.department||'';document.querySelector('#purpose').value=x.purpose||x.client||'';document.querySelector('#project').value=x.project||'';document.querySelector('#people').value=x.people||1;let audit=document.querySelector('#audit');audit.textContent=x.updatedAt?'Última alteração por '+(x.updatedBy||x.employee||'funcionário')+' em '+new Date(x.updatedAt).toLocaleString('pt-BR'):(x.createdAt?'Criada por '+(x.createdBy||x.employee||'funcionário')+' em '+new Date(x.createdAt).toLocaleString('pt-BR'):'Reserva antiga sem histórico');audit.style.display='block';document.querySelector('#deleteBtn').style.display='block';choose(x.studio);showModal()}function showModal(){document.querySelector('#error').style.display='none';document.querySelector('#overlay').classList.add('open')}function closeModal(){document.querySelector('#overlay').classList.remove('open')}
async function save(e){e.preventDefault();let employee=val('employee').trim(),department=val('department'),purpose=val('purpose').trim(),existing=editing?bookings.find(b=>b.id===editing):null,x={id:editing||crypto.randomUUID(),date:val('date'),start:val('start'),end:val('end'),studio,employee,department,purpose,project:val('project').trim(),people:Number(val('people'))||1,note:val('note').trim(),client:purpose+' — '+employee,createdBy:existing?.createdBy||employee,createdAt:existing?.createdAt||new Date().toISOString(),updatedBy:employee,updatedAt:new Date().toISOString()},err='';if(!employee)err='Informe o nome do funcionário responsável.';else if(!department)err='Selecione o setor.';else if(!purpose)err='Informe a finalidade da reserva.';else if(x.end<=x.start)err='O horário final precisa ser depois do inicial.';if(err)return showError(err);localStorage.setItem('agenda-employee',employee);localStorage.setItem('agenda-department',department);status('Salvando...');try{const r=await fetch('/api/bookings',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(x)}),data=await r.json();if(!r.ok)return showError(data.error||'Não foi possível salvar.');bookings=data;closeModal();render();status('✓ Reserva salva e sincronizada')}catch(e){showError('Falha de conexão. Tente novamente.')}}function showError(t){let el=document.querySelector('#error');el.textContent='⚠ '+t;el.style.display='block';status('Erro ao sincronizar')}function val(id){return document.querySelector('#'+id).value}async function removeBooking(){if(!editing)return;status('Excluindo...');try{const r=await fetch('/api/bookings?id='+encodeURIComponent(editing),{method:'DELETE'}),data=await r.json();if(!r.ok)return showError(data.error||'Não foi possível excluir.');bookings=data;closeModal();render();status('✓ Alteração sincronizada')}catch(e){showError('Falha de conexão. Tente novamente.')}}render();load();setInterval(load,30000);
</script></body></html>
